name: CI/CD Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 默认具备向 ghcr.io 推送包（packages: write）的权限
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/chowdoff/matreko-server:latest

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    # GitHub 不允许在 if 表达式里直接引用 secrets，故用 env 中转后再在 if 判断
    env:
      DEPLOY_ENABLED: ${{ secrets.SSH_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Deploy via SSH
        # 仅在配置了 SSH 密钥后才执行部署；未配置时跳过（不报错）
        if: ${{ env.DEPLOY_ENABLED == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            REPO_DIR=/opt/matreko
            mkdir -p "$REPO_DIR"
            cd "$REPO_DIR"
            # 目录还不是 git 仓库时，先暂存已有的 data/.env，克隆仓库后再还原，
            # 让流水线不依赖人工预先在服务器上 clone（兼容目录非空/有残留子目录等情况）
            if [ ! -d .git ]; then
              TMP=$(mktemp -d)
              [ -e data ] && mv data "$TMP/"
              [ -e .env ] && mv .env "$TMP/"
              rm -rf ./* ./.[!.]* 2>/dev/null || true
              git clone https://github.com/chowdoff/matreko-server.git .
              [ -e "$TMP/data" ] && mv "$TMP/data" .
              [ -e "$TMP/.env" ] && mv "$TMP/.env" .
            else
              git pull --ff-only
            fi
            docker compose pull
            docker compose up -d
            docker image prune -f
